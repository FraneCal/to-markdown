<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anything → Markdown</title>
<meta name="description" content="Convert PDF, Word, Excel, PowerPoint, HTML and more to Markdown in your browser. Powered by Microsoft MarkItDown.">
<meta name="color-scheme" content="light dark">
<style>
  /* Colors are named by role. Accent means "you can act on this" and nothing else. */
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --well: #f5f5f7;
    --text: #1d1d1f; --muted: #5f5f66;
    --line: #d2d2d7; --line-strong: #86868b;
    --accent: #0a5fd1; --accent-text: #ffffff; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #1c1c1f; --well: #111113;
      --text: #f2f2f4; --muted: #a3a3ab;
      --line: #38383d; --line-strong: #7c7c84;
      --accent: #6cb0ff; --accent-text: #06213f; --error: #ff8a80;
    }
  }
  @media (prefers-contrast: more) {
    :root { --muted: var(--text); --line: var(--line-strong); --line-strong: var(--text); }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 3.5rem 1rem 4rem; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, Menlo, monospace; }

  h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.2; margin: 0 0 .4rem; letter-spacing: -0.02em; }
  h1 .mono { color: var(--muted); font-weight: 400; margin-right: .15em; }
  .lead { color: var(--muted); margin: 0 0 1.75rem; max-width: 34rem; text-wrap: balance; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Buttons */
  button, .button {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 2rem; padding: .3rem .8rem; border-radius: .5rem; cursor: pointer;
    font: inherit; font-size: .875rem; white-space: nowrap;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    transition: border-color .15s;
  }
  button:hover, .button:hover { border-color: var(--line-strong); }
  .prominent, .prominent:hover {
    background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600;
  }
  .prominent:hover { filter: brightness(1.08); }
  @media (pointer: coarse) {
    button, .button { min-height: 2.75rem; padding-inline: 1rem; }
  }

  /* Drop zone */
  #drop {
    display: flex; flex-direction: column; align-items: center; gap: .6rem;
    border: 1.5px dashed var(--line-strong); border-radius: 1rem;
    background: var(--surface); padding: 2.5rem 1.25rem; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop.over { border-style: solid; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  #drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  #drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #drop .button { min-height: 2.75rem; padding-inline: 1.4rem; font-size: 1rem; }
  #drop .hint, #drop .formats { color: var(--muted); font-size: .875rem; }
  #drop .formats { max-width: 30rem; text-wrap: balance; }
  @media (hover: none) { #drop .hint { display: none; } }

  /* Loading and status */
  #loading { margin: .9rem .1rem 0; }
  #loading[hidden] { display: none; }
  progress { display: block; width: 100%; height: .35rem; accent-color: var(--accent); }
  #status { color: var(--muted); font-size: .875rem; margin: .5rem .1rem 0; min-height: 1.4em; }
  #status.error { color: var(--error); }

  /* Results */
  .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 1.75rem 0 .75rem; }
  .toolbar[hidden] { display: none; }
  .toolbar .total { margin-right: auto; color: var(--muted); font-size: .875rem; }

  .file {
    background: var(--surface); border: 1px solid var(--line); border-radius: .85rem;
    padding: .85rem 1rem; margin-bottom: .65rem;
  }
  .file header { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .file .info { margin-right: auto; min-width: 12rem; flex: 1; }
  .file .name { font-weight: 600; overflow-wrap: anywhere; }
  .file .meta { color: var(--muted); font-size: .8125rem; }
  .file.failed .meta { color: var(--error); }
  .file pre {
    margin: .75rem 0 0; padding: .7rem .85rem; max-height: 20rem; overflow: auto;
    background: var(--well); border-radius: .5rem; white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: .8125rem; line-height: 1.55;
  }

  @media (max-width: 30rem) {
    /* Keep each row's actions together on their own line */
    .file .info, .toolbar .total { flex-basis: 100%; }
  }

  footer { color: var(--muted); font-size: .8125rem; margin-top: 2.5rem; }
  footer p { margin: 0 0 .25rem; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1><span class="mono" aria-hidden="true">#</span>Anything → Markdown</h1>
  <p class="lead">Turn documents into clean Markdown that costs far fewer tokens to give to an AI.</p>

  <label id="drop">
    <input id="picker" type="file" multiple>
    <span class="button prominent">Choose files</span>
    <span class="hint">or drop them anywhere on this page</span>
    <span class="formats">PDF, Word, Excel, PowerPoint, HTML, CSV, JSON, XML, EPUB, ZIP, text and code</span>
  </label>

  <div id="loading">
    <progress id="progress" max="4" value="0" aria-label="Getting the converter ready"></progress>
  </div>
  <p id="status" role="status">Getting the converter ready…</p>

  <div class="toolbar" id="toolbar" hidden>
    <span class="total" id="total"></span>
    <button id="copy-all" class="prominent">Copy all</button>
    <button id="download-all">Download all</button>
    <button id="clear">Clear</button>
  </div>
  <div id="files"></div>

  <footer>
    <p>Files stay on this device. Nothing is uploaded.</p>
    <p>Images, audio and scanned pages are not converted.</p>
    <p>Powered by <a href="https://github.com/microsoft/markitdown">Microsoft MarkItDown</a>.</p>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), filesEl = $("files"), drop = $("drop");
const items = new Map(); // id -> { name, size, el, markdown }
let nextId = 0, pending = 0, engineReady = false, loadStep = 0;

const tokens = (text) => Math.ceil(text.length / 4); // rough estimate
const fmt = (n) => n.toLocaleString("en-US");
const plural = (n, word) => `${fmt(n)} ${word}${n === 1 ? "" : "s"}`;
const byteSize = (text) => new Blob([text]).size;
function fmtBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

function refresh() {
  const done = [...items.values()].filter((i) => i.markdown);
  $("toolbar").hidden = items.size === 0;
  $("copy-all").disabled = $("download-all").disabled = done.length === 0;
  if (done.length) {
    const before = done.reduce((sum, i) => sum + i.size, 0);
    const after = done.reduce((sum, i) => sum + byteSize(i.markdown), 0);
    const total = done.reduce((sum, i) => sum + tokens(i.markdown), 0);
    $("total").textContent =
      `${plural(done.length, "file")} · ${fmtBytes(before)} → ${fmtBytes(after)} · about ${plural(total, "token")}`;
  } else {
    $("total").textContent = "";
  }
  if (!engineReady) {
    const waiting = pending ? ` ${plural(pending, "file")} will convert as soon as it is ready.` : " You can add files now.";
    setStatus(`Getting the converter ready, step ${Math.max(loadStep, 1)} of 4. The first visit takes about 10 seconds.${waiting}`);
  } else {
    setStatus(pending ? `Converting ${plural(pending, "file")}…` : "");
  }
}

function button(label, description, onClick) {
  const b = document.createElement("button");
  b.textContent = label;
  b.setAttribute("aria-label", description);
  b.addEventListener("click", () => onClick(b));
  return b;
}

async function copy(text, btn) {
  await navigator.clipboard.writeText(text);
  const label = btn.textContent;
  btn.textContent = "Copied";
  setTimeout(() => (btn.textContent = label), 1200);
}

function download(text, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown" }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

const mdName = (name) => name.replace(/\.[^.]+$/, "") + ".md";
const combined = () => [...items.values()].filter((i) => i.markdown)
  .map((i) => `# ${i.name}\n\n${i.markdown}`).join("\n\n---\n\n");

function remove(id) {
  items.get(id).el.remove();
  items.delete(id);
  refresh();
}

async function addFiles(fileList) {
  for (const file of fileList) {
    const id = nextId++;
    const el = document.createElement("section");
    el.className = "file";
    const header = document.createElement("header");
    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = file.name;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = engineReady ? "Converting…" : "Waiting for the converter…";
    info.append(name, meta);
    header.append(info, button("Remove", `Remove ${file.name}`, () => remove(id)));
    el.append(header);
    filesEl.prepend(el);
    items.set(id, { name: file.name, size: file.size, el, markdown: null });
    pending++;
    refresh();
    const onPages = (done, total) => {
      if (items.has(id)) meta.textContent = `Converting… page ${fmt(done)} of ${fmt(total)}`;
    };
    file.arrayBuffer()
      .then((buffer) => convertFile(id, file.name, buffer, onPages))
      .then((markdown) => showResult(id, markdown), (err) => showError(id, err.message))
      .finally(() => { pending--; refresh(); });
  }
}

function showError(id, message) {
  const item = items.get(id);
  if (!item) return; // removed while converting
  item.el.classList.add("failed");
  item.el.querySelector(".meta").textContent = "Not converted. " + message;
}

function showResult(id, markdown) {
  const item = items.get(id);
  if (!item) return; // removed while converting
  const meta = item.el.querySelector(".meta");
  item.markdown = markdown;
  meta.classList.add("mono");
  meta.textContent =
    `${fmtBytes(item.size)} → ${fmtBytes(byteSize(markdown))} · about ${plural(tokens(markdown), "token")}`;
  item.el.querySelector("header").lastChild.before(
    button("Copy", `Copy ${item.name} as Markdown`, (b) => copy(item.markdown, b)),
    button("Download", `Download ${mdName(item.name)}`, () => download(item.markdown, mdName(item.name))),
  );
  const pre = document.createElement("pre");
  pre.className = "mono";
  pre.tabIndex = 0; // scrollable region must be reachable by keyboard
  pre.setAttribute("aria-label", `Markdown for ${item.name}`);
  pre.textContent = markdown;
  item.el.append(pre);
}

// --- Workers ---------------------------------------------------------------
// Each worker runs its own copy of the converter. The primary one loads with
// the page; helpers start only when a long PDF arrives, so its pages can be
// converted on several CPU cores at once.
const POOL_SIZE = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1));
const PARALLEL_MIN_PAGES = 24, PAGES_PER_JOB = 4;
const STOPPED = "The converter stopped working. Reload this page and try again.";
let nextJob = 0;

function startWorker(onStatus) {
  const w = { worker: new Worker("worker.js"), jobs: new Map() };
  w.ready = new Promise((resolve, reject) => {
    w.worker.onmessage = ({ data }) => {
      if (data.type === "status") return onStatus && onStatus(data.step);
      if (data.type === "ready") return resolve();
      if (data.type === "fatal") return reject(new Error(data.error));
      const job = w.jobs.get(data.job);
      w.jobs.delete(data.job);
      if (data.type === "error") job.reject(new Error(data.error));
      else job.resolve(data.result);
    };
    w.worker.onerror = (e) => {
      console.error(e.message);
      reject(new Error(e.message));
      for (const job of w.jobs.values()) job.reject(new Error(STOPPED));
      w.jobs.clear();
    };
  });
  w.ready.catch(() => {});
  return w;
}

// Run one converter.py function in a worker
function call(w, fn, ...args) {
  return new Promise((resolve, reject) => {
    const job = nextJob++;
    w.jobs.set(job, { resolve, reject });
    w.worker.postMessage({ job, fn, args });
  });
}

const primary = startWorker((step) => {
  loadStep = step;
  $("progress").value = step - 0.5;
  refresh();
});
const helpers = [];
function pool() {
  while (helpers.length < POOL_SIZE - 1) helpers.push(startWorker());
  return helpers;
}

primary.ready.then(() => {
  engineReady = true;
  $("loading").hidden = true;
  for (const item of items.values()) {
    if (!item.markdown && !item.el.classList.contains("failed")) {
      item.el.querySelector(".meta").textContent = "Converting…";
    }
  }
  refresh();
}, (err) => {
  $("loading").hidden = true;
  console.error(err);
  setStatus("The converter could not load. Check the internet connection, then reload this page.", true);
});

async function convertFile(id, name, buffer, onPages) {
  try {
    await primary.ready;
  } catch {
    throw new Error("The converter could not load.");
  }
  if (/\.pdf$/i.test(name)) {
    try {
      return await convertPdf(id, buffer, onPages);
    } catch (err) {
      if (/^No text was found/.test(err.message)) throw err;
      console.warn("Page-range PDF conversion failed, converting in one piece.", err);
    }
  }
  return call(primary, "convert", buffer, name);
}

async function convertPdf(id, buffer, onPages) {
  const key = `pdf${id}`;
  const opened = [primary];
  try {
    const total = await call(primary, "pdf_open", key, buffer);
    const jobs = [];
    for (let start = 0; start < total; start += PAGES_PER_JOB) {
      jobs.push([start, Math.min(start + PAGES_PER_JOB, total)]);
    }
    const results = new Array(jobs.length);
    let next = 0, done = 0;
    // Workers take the next page range whenever they are free
    const work = async (w) => {
      while (next < jobs.length) {
        const j = next++;
        results[j] = await call(w, "pdf_pages", key, ...jobs[j]);
        done += jobs[j][1] - jobs[j][0];
        onPages(done, total);
      }
    };
    const join = async (w) => {
      try { await w.ready; } catch { return; } // a helper that fails to load is skipped
      if (next >= jobs.length) return;
      opened.push(w);
      await call(w, "pdf_open", key, buffer);
      await work(w);
    };
    const team = total >= PARALLEL_MIN_PAGES ? pool() : [];
    await Promise.all([work(primary), ...team.map(join)]);

    const pages = results.flat(); // [isTablePage, markdown] per page
    let text = pages.some((p) => p[0]) ? pages.map((p) => p[1]).filter(Boolean).join("\n\n") : "";
    if (!text.trim()) {
      // No table pages: MarkItDown uses plain text extraction for the whole document
      const size = Math.ceil(total / opened.length);
      const parts = await Promise.all(opened.map((w, i) =>
        i * size < total ? call(w, "pdf_text", key, i * size, Math.min((i + 1) * size, total)) : ""));
      text = parts.join("");
    }
    return await call(primary, "pdf_finish", text);
  } finally {
    for (const w of opened) call(w, "pdf_close", key).catch(() => {});
  }
}
// ---------------------------------------------------------------------------

$("picker").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
$("copy-all").addEventListener("click", (e) => copy(combined(), e.target));
$("download-all").addEventListener("click", () => download(combined(), "converted.md"));
$("clear").addEventListener("click", () => { items.clear(); filesEl.replaceChildren(); refresh(); });

// Accept drops anywhere on the page, but only highlight for files
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); drop.classList.add("over"); } });
addEventListener("dragleave", (e) => { if (!e.relatedTarget) drop.classList.remove("over"); });
addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  drop.classList.remove("over");
  addFiles(e.dataTransfer.files);
});

refresh();
</script>
</body>
</html>
